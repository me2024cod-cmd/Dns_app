name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer Spec
      run: |
        buildozer init

    - name: Configure Buildozer for App
      run: |
        sed -i 's/# title =/title = DNS Matrix Pro/' buildozer.spec
        sed -i 's/# package.name =/package.name = dnsmatrix/' buildozer.spec
        sed -i 's/# package.domain =/package.domain = org.dns/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,tkinter/' buildozer.spec
        sed -i 's/# orientation = portrait/orientation = portrait/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
