name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer Spec
      run: |
        buildozer init

    - name: Configure Buildozer for App
      run: |
        cat >> buildozer.spec << 'EOF'
        [app]
        title = DNS Matrix Pro
        package.name = dnsmatrix
        package.domain = org.dns
        requirements = python3,kivy
        orientation = portrait
        
        [app:android]
        android.accept_sdk_license = True
        android.api = 33
        android.min_api = 21
        android.sdk_version = 33
        android.ndk = 25c
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
